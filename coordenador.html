<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordenação - Sistema de Faltas IFC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-layout">
    <header class="top-bar">
      <div class="logo">Sistema de Faltas</div>
      <div class="menu-usuario">
        <span class="nome" id="nome-usuario"></span>
        <!-- FRAGILIDADE 1 (Consistência): botão logout em vermelho, mesma cor de status crítico -->
        <button class="btn btn-logout" onclick="logout()">Sair</button>
      </div>
    </header>

    <main>
      <div class="page-title">
        <h1>Painel de Coordenação</h1>
        <p class="subtitulo">Visão geral das turmas de Ciência da Computação · 2026.1</p>
      </div>

      <nav class="nav-secundaria">
        <a href="coordenador.html" class="ativo">Visão geral</a>
        <a href="alertas.html">Alertas</a>
      </nav>

      <!-- Cards de estatísticas -->
      <div class="card-stats" id="cards-stats"></div>

      <!-- Filtros -->
      <div class="card" style="margin-bottom: 16px;">
        <h3>Filtros</h3>
        <div class="filtros">
          <div>
            <label for="filtro-busca">Buscar disciplina</label><br>
            <!-- FRAGILIDADE 7 (Controle): input aplica o filtro em tempo real -->
            <input type="text" id="filtro-busca" placeholder="Nome ou código">
          </div>
          <div>
            <label for="filtro-professor">Professor</label><br>
            <!-- FRAGILIDADE 7 (Controle): select aplica filtro no change automaticamente -->
            <select id="filtro-professor">
              <option value="">Todos</option>
            </select>
          </div>
          <!-- FRAGILIDADE 6 (Reversão): não há botão "limpar filtros" -->
          <!-- FRAGILIDADE 3 (Feedback): não há contador "X disciplinas encontradas" -->
        </div>
      </div>

      <!-- Lista de disciplinas -->
      <div class="grid-disciplinas" id="lista-disciplinas"></div>
    </main>
  </div>

  <!-- FRAGILIDADE 7 (Controle): modal que abre sozinho ao carregar a página -->
  <div class="modal-overlay" id="modal-boas-vindas">
    <div class="modal">
      <h2>⚠ Atenção</h2>
      <p>Existem <strong id="modal-count">0</strong> alunos em situação crítica no curso (mais de 25% de faltas).</p>
      <p class="subtitulo">Recomendamos verificar a aba Alertas.</p>
      <div class="acoes">
        <button class="btn" onclick="fecharModal()">Depois</button>
        <button class="btn btn-primario" onclick="window.location.href='alertas.html'">Ir para Alertas</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    const user = exigirLogin('coordenador');
    if (user) inicializarDashboardCoordenador(user);
  </script>
  <script src="js/themeSwitch.js"></script>
</body>
</html>
