<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluno - Sistema de Faltas IFC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="top-bar">
      <div class="logo">Sistema de Faltas</div>
      <div class="menu-usuario">
        <span class="nome" id="nome-usuario"></span>
        <button class="btn btn-logout" onclick="logout()">Sair</button>
      </div>
    </header>

    <main>
      <div class="page-title">
        <h1 id="titulo-aluno">—</h1>
        <p class="subtitulo" id="subtitulo-aluno"></p>
      </div>

      <div class="card-stats" id="cards-stats"></div>

      <div class="card" style="margin-bottom: 16px;">
        <h2>Faltas por disciplina</h2>
        <div class="grafico-container">
          <canvas id="grafico-aluno"></canvas>
        </div>
      </div>

      <div class="card">
        <h2>Disciplinas cursadas</h2>
        <table class="tabela">
          <thead>
            <tr>
              <th>Código</th>
              <th>Disciplina</th>
              <th>Professor</th>
              <th>Faltas</th>
              <th>%</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody-disciplinas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/aluno.js"></script>
  <script>
    const user = exigirLogin();
    if (user) inicializarAluno(user);
  </script>
  <script src="js/themeSwitch.js"></script>
</body>
</html>
