<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas - Sistema de Faltas IFC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-layout">
    <header class="top-bar">
      <div class="logo"><a href="./professor.html">Sistema de Faltas</a></div>
      <div class="menu-usuario">
        <span class="nome" id="nome-usuario"></span>
        <button class="btn btn-logout" onclick="logout()">Sair</button>
      </div>
    </header>

    <main>
      <div class="page-title">
        <h1>Alertas de Faltas</h1>
        <p class="subtitulo">Alunos próximos ou já no limite de 25% de faltas</p>
      </div>

      <nav class="nav-secundaria">
        <a href="#" id="link-voltar">Visão geral</a>
        <a href="alertas.html" class="ativo">Alertas</a>
      </nav>

      <div class="card-stats" id="cards-stats"></div>

      <div class="card">
        <div class="filtros">
          <div>
            <label for="filtro-nivel">Nível</label><br>
            <select id="filtro-nivel">
              <option value="">Todos os níveis</option>
              <option value="critico">Apenas críticos (≥25%)</option>
              <option value="atencao">Apenas atenção (15-25%)</option>
            </select>
          </div>
          <div>
            <label for="filtro-busca-aluno">Buscar aluno</label><br>
            <input type="text" id="filtro-busca-aluno" placeholder="Nome ou matrícula">
          </div>
        </div>

        <table class="tabela">
          <thead>
            <tr>
              <th>Aluno</th>
              <th>Matrícula</th>
              <th>Disciplina</th>
              <th>Faltas</th>
              <th>%</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody-alertas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/alertas.js"></script>
  <script>
    const user = exigirLogin();
    if (user) inicializarAlertas(user);
  </script>
  <script src="js/themeSwitch.js"></script>
</body>
</html>
